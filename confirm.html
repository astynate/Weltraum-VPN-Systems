<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weltraum® – Account Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');

    body {
        height: 100vh;
        margin: 0;
        font-family: "Lato", sans-serif;
        background: #010811;
        background: linear-gradient(to bottom, #1C4477, black);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Lato", sans-serif;
    }

    .header {
        width: calc(100vw - 100px);
        padding: 0 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-button {
        height: fit-content;
        width: fit-content;
        border-radius: 30px; 
        padding: 18px 30px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        outline: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
    }

    .container {
        max-width: 480px;
        margin: 80px auto;
        text-align: center;
        padding: 20px;
    }

    .logo {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 40px;
    }

    .code-inputs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 25px;
    }

    .code-inputs input {
        width: 50px;
        height: 80px;
        background: hsla(0, 0%, 100%, 0.1);
        border: 2px solid hsla(0, 0%, 100%, 0.0);
        border-radius: 8px;
        font-size: 28px;
        text-align: center;
        color: #fff;
        outline: none;
        transition: 0.2s;
    }

    .code-inputs input:focus {
        border-color: hsla(0, 0%, 100%, 0.2);
        box-shadow: 0 0 50px hsla(0, 0%, 100%, 0.2);
    }

    .button {
        outline: none;
        border: none;
    }

    .button {
        height: 60px;
        width: 220px;
        padding: 14px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 15px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        font-size: 16px;
        margin-bottom: 10px;
    }

    .button:hover {
        background: #e5e5e5;
    }

    .desc {
        margin-top: 25px;
        font-size: 15px;
        line-height: 1.5;
        color: #cfcfcf;
    }

    .email-box {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .email-box input {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        color: #fff;
    }

    .email-box button {
        width: auto;
        padding: 10px 18px;
    }

    .flags {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }

    .flags img {
        width: 28px;
        height: 18px;
        border-radius: 3px;
    }
</style>
</head>
<body>
    <div class="container">
        <h2 style="margin: 0; padding: 0;">Confirm your account</h2>
        <p style="opacity: 0.75; font-weight: 400; font-size: 16px; margin: 5px;">
            To confirm your account, please enter the verification code in the link below.
        </p>
        <br>
        <div class="code-inputs">
            <input maxlength="1" autofocus>
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
        </div>
        <br>
        <button class="button">Confirm</button>
        <br>
        <button class="button" style="background: rgba(255, 255, 255, 0.14); color: white;">Resend</button>
    </div>
    <script>
        const inputs = document.querySelectorAll('.code-inputs input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                input.value = input.value.toUpperCase(); // force uppercase

                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && input.value === "" && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData("text");

                const chars = paste.slice(0, inputs.length).toUpperCase();

                chars.split("").forEach((char, i) => {
                    inputs[i].value = char;
                });

                const last = Math.min(chars.length - 1, inputs.length - 1);
                inputs[last].focus();
            });
        });

        function getVerificationCode() {
            return Array.from(inputs).map(i => i.value).join('');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const link = urlParams.get("link");

        async function sendCode() {
            const code = getVerificationCode();

            if (code.length !== 6) {
                alert("Please enter the full 6-digit code.");
                return;
            }

            const formData = new URLSearchParams();

            formData.append("link", link);
            formData.append("code", code);

            const response = await fetch("http://localhost:5000/api/confirmations", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            });

            const result = await response.json();

            if (result.success) {
                window.location.href = "confirmed.html";
            } else {
                alert("Invalid code.");
            }
        }

        document.querySelector(".button").addEventListener("click", sendCode);
    </script>
</body>
</html>
